backend:
  name: github
  repo: yin37/Firefly
  branch: master
  base_url: https://auth.xiaoyin.ccwu.cc
  auth_endpoint: /auth
media_folder: /public/images
public_folder: /images
site_url: https://blog.xiaoyin.ccwu.cc
locale: zh_CN

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    editor:
      preview: false
    sortable_fields: [title, published]
    summary: "{{title}} - {{published}}"
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 发布日期
        name: published
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        default: "{{now}}"
      - label: 简介
        name: description
        widget: string
        required: false
      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
      - label: 分类
        name: category
        widget: string
        required: false
      - label: 置顶（显示在文章列表最前面）
        name: pinned
        widget: boolean
        default: false
        required: false
      - label: 系列（连载文章专用，相同系列名自动归为一组）
        name: series
        widget: string
        required: false
      - label: 草稿（开了就不会发布到线上）
        name: draft
        widget: boolean
        default: false
        required: false
      - label: 封面图（可选）
        name: image
        widget: image
        required: false
      - label: 正文
        name: body
        widget: markdown

  - name: settings
    label: 站点设置
    files:
      - name: profile
        label: 个人信息
        file: src/config/profile.json
        format: json
        fields:
          - label: 名字
            name: name
            widget: string
          - label: 个人签名
            name: bio
            widget: string
            required: false
          - label: 头像（上传后自动存到 public/images）
            name: avatar
            widget: image
            required: false
          - label: 社交链接（留空图标代码的条目会被忽略）
            name: links
            widget: list
            required: false
            fields:
              - label: 名称
                name: name
                widget: string
              - label: 链接地址
                name: url
                widget: string
              - label: 图标代码（如 fa7-brands:github）
                name: icon
                widget: string
                required: false
              - label: 显示名称文字
                name: showName
                widget: boolean
                default: false
                required: false
